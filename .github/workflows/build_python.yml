# A reusable workflow for building and testing the Python package.
name: Python Build

on:
  workflow_call:
    inputs:
      python_versions:
        description: 'Which versions to build wheels for'
        required: false
        default: cp313*
        type: string


jobs:
  build:
    name: Python - ${{ matrix.os }} - ${{ matrix.runs-on }} - ${{ matrix.archs }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os: [ linux-intel, linux-arm, windows, macOS-intel, macOS-arm, iOS, pyodide ]
        include:
          - archs: auto
            platform: auto
            python_versions: ${{ inputs.python_versions }}
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows
            runs-on: windows-latest
          - os: macos-intel
            # macos-13 was the last x86_64 runner
            runs-on: macos-13
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
            archs: auto,universal2
          - os: ios
            runs-on: macos-latest
            platform: ios
          - os: pyodide
            runs-on: ubuntu-latest
            platform: pyodide
            python_versions: cp312*
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ matrix.python_versions }}
          CIBW_SKIP: "*-musllinux*"

      - name: Inspect
        run: ls wheelhouse/

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/
